version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lenny_postgres
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny_secret
      POSTGRES_DB: lenny_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenny_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lenny:lenny_secret@postgres:5432/lenny_db
      - DEFAULT_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
